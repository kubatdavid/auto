<VirtualHost *:8080>
    ServerName auto.abhishekam.cz
    ServerAlias auto.force.local
    DocumentRoot /var/www/auto/html

    <Directory /var/www/auto/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
        <IfModule mod_php.c>
            php_admin_value post_max_size 32M
        </IfModule>
    </Directory>

    ErrorLog /var/www/auto/log/error.log
    CustomLog /var/www/auto/log/access.log combined
</VirtualHost>
